# =============================================================================
# Kadai Server — on-premise (one shop, LAN), Docker Compose
#
#   cp .env.example .env    # then fill in the secrets (install-linux.sh does this for you)
#   docker compose up -d
#   open http://<this-pc>:8080  → first-run setup wizard (/setup)
#
# Optional LAN HTTPS (needed for the installable POS app on counter PCs other than this one):
#   docker compose --profile tls up -d        (see docs/DEPLOYMENT.md "On-prem HTTPS")
#
# Services: db (PostgreSQL 16), kadai (API + web app + embedded worker, migrations on boot),
# caddy (profile "tls" only). PostgreSQL is not published on the LAN.
# =============================================================================
name: ${COMPOSE_PROJECT_NAME:-kadai}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  db:
    # Debian release pinned: switching the base image changes glibc collations (RUNBOOK.md).
    image: ${KADAI_POSTGRES_IMAGE:-postgres:16-trixie}
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --data-checksums
      # Read by initdb/01-roles.sh on the very first start (empty data volume) only.
      KADAI_DB_NAME: kadai
      KADAI_DB_OWNER: kadai_owner
      KADAI_DB_OWNER_PASSWORD: ${KADAI_DB_OWNER_PASSWORD:?set KADAI_DB_OWNER_PASSWORD in .env}
      KADAI_DB_APP_USER: kadai_app
      KADAI_DB_APP_PASSWORD: ${KADAI_DB_APP_PASSWORD:?set KADAI_DB_APP_PASSWORD in .env}
      TZ: ${TZ:-Asia/Kolkata}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - max_connections=100
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - log_min_duration_statement=2000
      - -c
      - log_checkpoints=on
      - -c
      - log_lock_waits=on
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: fails while the init scripts run (the image's temporary server is socket-only).
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d kadai -q']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    stop_grace_period: 60s
    networks: [kadai]
    logging: *logging

  kadai:
    image: ${KADAI_IMAGE:?set KADAI_IMAGE in .env, e.g. ghcr.io/jayeskumar/my_shop:1.0.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      KADAI_MODE: onprem
      NODE_ENV: production
      PORT: '8080'
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Kolkata}
      DATABASE_URL: postgres://kadai_app:${KADAI_DB_APP_PASSWORD}@db:5432/kadai
      DATABASE_SYSTEM_URL: postgres://kadai_owner:${KADAI_DB_OWNER_PASSWORD}@db:5432/kadai
      DATABASE_APP_ROLE: kadai_app
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      KADAI_MIGRATE_ON_BOOT: 'true'
      KADAI_EMBEDDED_WORKER: 'true'
      KADAI_DATA_DIR: /data
      KADAI_SERVE_WEB: 'true'
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # Only the optional Caddy (profile "tls") sits in front of the app, inside this network.
      TRUST_PROXY: ${KADAI_DOCKER_SUBNET:-172.31.250.0/24}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      KADAI_ENCRYPTION_KEYS: ${KADAI_ENCRYPTION_KEYS:?set KADAI_ENCRYPTION_KEYS in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      KADAI_LICENSE_PUBLIC_KEY: ${KADAI_LICENSE_PUBLIC_KEY:-}
      # Messaging providers (optional; "log" writes messages to the log only).
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-}
      MSG91_DLT_ENTITY_ID: ${MSG91_DLT_ENTITY_ID:-}
      MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-log}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-Kadai <no-reply@localhost>}
    ports:
      # LAN access for every counter PC. Set KADAI_HTTP_BIND=127.0.0.1 when only HTTPS
      # (profile "tls") should be reachable from other machines.
      - ${KADAI_HTTP_BIND:-0.0.0.0}:${KADAI_HTTP_PORT:-8080}:8080
    volumes:
      # Files, logs and backups live on the host so they are easy to copy off this PC.
      # The folder must be owned by uid 10001 (install-linux.sh does this).
      - ${KADAI_DATA_PATH:-./data}:/data
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs']
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot applies every migration before the HTTP port opens.
      start_period: 180s
    stop_grace_period: 40s
    networks: [kadai]
    logging: *logging

  caddy:
    image: ${KADAI_CADDY_IMAGE:-caddy:2}
    profiles: [tls]
    restart: unless-stopped
    depends_on:
      - kadai
    environment:
      # Space/comma separated names the counter PCs use, e.g. "kadai.local, 192.168.1.10".
      KADAI_TLS_SITES: ${KADAI_TLS_SITES:-localhost}
    ports:
      - ${KADAI_HTTPS_PORT:-443}:443
      - ${KADAI_TLS_HTTP_PORT:-80}:80
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [kadai]
    logging: *logging

networks:
  kadai:
    ipam:
      config:
        - subnet: ${KADAI_DOCKER_SUBNET:-172.31.250.0/24}

volumes:
  pgdata:
  caddy-data:
  caddy-config:
