# EXAMPLE ONLY — not referenced by kustomization.yaml and never applied by it.
# Create the real Secret out of band, for example:
#   kubectl -n kadai create secret generic kadai-secrets --from-env-file=kadai-secrets.env
# or with External Secrets Operator / Sealed Secrets / SOPS. Generate fresh values:
#   openssl rand -base64 48                               → JWT_SECRET
#   echo "k$(date +%Y%m):$(openssl rand -base64 32)"      → KADAI_ENCRYPTION_KEYS
#   openssl rand -hex 24                                  → METRICS_TOKEN, DB passwords
apiVersion: v1
kind: Secret
metadata:
  name: kadai-secrets
type: Opaque
stringData:
  # Runtime role (RLS enforced) and owner role (migrations, system pool). Use TLS to the DB.
  DATABASE_URL: postgres://kadai_app:CHANGE_ME@postgres.internal:5432/kadai?sslmode=verify-full
  DATABASE_SYSTEM_URL: postgres://kadai_owner:CHANGE_ME@postgres.internal:5432/kadai?sslmode=verify-full
  REDIS_URL: rediss://:CHANGE_ME@redis.internal:6379/0
  JWT_SECRET: CHANGE_ME
  # Key ring: first key encrypts, all keys decrypt (rotation: prepend a new key).
  KADAI_ENCRYPTION_KEYS: CHANGE_ME
  METRICS_TOKEN: CHANGE_ME
  # Optional (omit what you do not use):
  S3_ACCESS_KEY_ID: ''
  S3_SECRET_ACCESS_KEY: ''
  MSG91_AUTH_KEY: ''
  MSG91_SENDER_ID: ''
  MSG91_DLT_ENTITY_ID: ''
  MSG91_OTP_TEMPLATE_ID: ''
  WHATSAPP_PHONE_NUMBER_ID: ''
  WHATSAPP_ACCESS_TOKEN: ''
  WHATSAPP_APP_SECRET: ''
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: ''
  SMTP_URL: ''
  RAZORPAY_PLATFORM_KEY_ID: ''
  RAZORPAY_PLATFORM_KEY_SECRET: ''
  RAZORPAY_PLATFORM_WEBHOOK_SECRET: ''
