apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kadai-api
  labels:
    app.kubernetes.io/component: api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kadai
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kadai-worker
  labels:
    app.kubernetes.io/component: worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kadai
      app.kubernetes.io/component: worker
