apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kadai-api
  labels:
    app.kubernetes.io/component: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kadai
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # GET /metrics requires "Authorization: Bearer <METRICS_TOKEN>".
      authorization:
        type: Bearer
        credentials:
          name: kadai-secrets
          key: METRICS_TOKEN
